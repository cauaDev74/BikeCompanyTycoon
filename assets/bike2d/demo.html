<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bike2D — demonstração (Fase 2)</title>
<link rel="icon" href="../brand/favicon-light.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
/* Bike Company Tycoon — design tokens (GDD §15). Uma paleta para o jogo todo. */
:root {
  /* cor */
  --bg: #0b2d7a;
  --navy: #071a4a;
  --fg: #ffffff;
  --accent: #3ccb4f;
  --money: var(--accent);
  --ev: var(--accent);
  --gold: #ffd43b;
  --warning: var(--gold);
  --destructive: #ff5c5c;

  /* vidro: branco em alfa */
  --surface: rgba(255,255,255,.07);
  --muted:   rgba(255,255,255,.08);
  --card:    rgba(255,255,255,.09);
  --steel:   rgba(255,255,255,.16);
  --border-glass: rgba(255,255,255,.18);
  --scrim: rgba(7,26,74,.72);
  --text-soft: rgba(255,255,255,.85);
  --glass-blur: 14px;

  /* forma: um valor, escala derivada */
  --radius: 16px;
  --radius-xs: calc(var(--radius) * .25);
  --radius-sm: calc(var(--radius) * .5);
  --radius-md: calc(var(--radius) * .75);
  --radius-lg: var(--radius);
  --radius-xl: calc(var(--radius) * 1.5);
  --radius-pill: 999px;

  /* espaçamento (grade de 4px) */
  --space-1: 4px;  --space-2: 8px;  --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px; --space-12: 48px;

  /* sombras */
  --shadow-1: 0 2px 8px rgba(7,26,74,.35);
  --shadow-2: 0 8px 24px rgba(7,26,74,.45);
  --shadow-3: 0 20px 48px rgba(7,26,74,.6);
  --focus-ring: 0 0 0 3px var(--bg), 0 0 0 5px var(--fg);

  /* z-index */
  --z-base: 0; --z-sticky: 10; --z-sheet: 30; --z-modal: 40; --z-toast: 50;

  /* tipografia */
  --font-display: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --text-xs: .875rem;
  --text-sm: .9375rem; --text-md: 1rem; --text-lg: 1.25rem;
  --text-xl: 1.75rem;  --text-2xl: 2.5rem; --text-3xl: 3.5rem;
  --lh-body: 1.5; --lh-display: 1.1;
  --tracking-display: .04em;

  /* motion (GDD §15) */
  --stage-ms: 520ms; --stage-hold: 3200ms; --stagger-ms: 35ms; --toast-ms: 2600ms;
  --ease: cubic-bezier(.2,.8,.2,1);

  /* moto procedural: sobrescritas pelo renderizador */
  --paint: #c8102e; --accent-paint: #f2c230;
}
@media (prefers-reduced-motion: reduce) {
  :root { --stage-ms: 0ms; --stage-hold: 0ms; --stagger-ms: 0ms; }
}
/* Sistema de vidro + componentes base. Requer design-tokens.css */
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 var(--text-md)/var(--lh-body) var(--font-body)}
:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.display{font-family:var(--font-display);letter-spacing:var(--tracking-display);line-height:var(--lh-display);font-weight:400}
.num-money{font-family:var(--font-display);color:var(--accent);letter-spacing:.02em}
.num-loss{font-family:var(--font-display);color:var(--destructive)}
.mono{font-family:var(--font-mono)}

.glass,.glass-strong,.glass-subtle{border:1px solid var(--border-glass);border-radius:var(--radius-lg);
  -webkit-backdrop-filter:blur(var(--glass-blur));backdrop-filter:blur(var(--glass-blur))}
.glass{background:var(--card)} .glass-subtle{background:var(--surface)} .glass-strong{background:var(--steel)}
.blueprint{background-color:var(--navy);background-image:linear-gradient(rgba(255,255,255,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.1) 1px,transparent 1px);background-size:24px 24px;border-radius:var(--radius-lg)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:44px;padding:0 var(--space-5);
  font:600 var(--text-sm)/1 var(--font-body);border-radius:var(--radius-pill);border:1px solid transparent;cursor:pointer;
  transition:transform 120ms var(--ease),background 120ms,box-shadow 120ms}
.btn svg{width:20px;height:20px}
.btn-primary{background:var(--fg);color:var(--navy);box-shadow:var(--shadow-1)}
.btn-primary:hover{background:#e8eefc} .btn-primary:active{transform:translateY(1px) scale(.98);box-shadow:none}
.btn-secondary{background:var(--steel);color:var(--fg);border-color:var(--border-glass)}
.btn-secondary:hover{background:rgba(255,255,255,.24)} .btn-secondary:active{transform:translateY(1px) scale(.98)}
.btn-danger{background:var(--destructive);color:var(--navy)}
.btn-danger:hover{background:#ff7676} .btn-danger:active{transform:translateY(1px) scale(.98)}
.btn:disabled,.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}

.tile{position:relative;display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4);min-height:112px;
  background:var(--card);border:1px solid var(--border-glass);border-radius:var(--radius-lg);color:var(--fg);text-align:left;cursor:pointer;
  -webkit-backdrop-filter:blur(var(--glass-blur));backdrop-filter:blur(var(--glass-blur));transition:transform 160ms var(--ease),background 160ms}
.tile svg{width:32px;height:32px}
.tile .tile-label{font-family:var(--font-display);letter-spacing:var(--tracking-display);font-size:var(--text-lg);line-height:1.1}
.tile:hover{background:var(--steel);transform:translateY(-2px)} .tile:active{transform:scale(.98)}
.tile[aria-disabled=true]{opacity:.45;cursor:not-allowed;transform:none}
.tile-grid .tile{animation:tile-in 360ms var(--ease) both;animation-delay:calc(var(--i,0) * var(--stagger-ms))}
@keyframes tile-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.part-card{display:flex;flex-direction:column;overflow:hidden;background:var(--card);border:1px solid var(--border-glass);border-radius:var(--radius-lg)}
.part-card .photo{aspect-ratio:4/3;background:linear-gradient(160deg,#c9d4e4,#9fb0c8);display:grid;place-items:center;color:var(--navy)}
.part-card .photo svg{width:40%;height:auto}
.part-card .body{padding:var(--space-3) var(--space-4) var(--space-4);display:grid;gap:var(--space-2)}
.part-card .name{font-weight:600}
.part-card .meta{display:flex;gap:var(--space-4);font-size:var(--text-xs);color:var(--text-soft)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:var(--radius-pill);background:var(--muted);border:1px solid var(--border-glass);font-size:var(--text-xs)}
.chip.up::before{content:"▲";color:var(--accent);font-size:.7em} .chip.down::before{content:"▼";color:var(--destructive);font-size:.7em}
.part-card:hover{background:var(--steel)}
.part-card.is-locked{background:var(--surface)} .part-card.is-locked .photo{filter:grayscale(1) brightness(.7)}
.lock-badge{display:inline-flex;align-items:center;gap:6px;font-size:var(--text-xs);font-weight:600;padding:4px 10px;border-radius:var(--radius-pill);background:var(--navy);border:1px solid var(--border-glass);width:fit-content}
.lock-badge svg{width:16px;height:16px}
.part-card.is-unaffordable .cost{color:var(--destructive);font-weight:700}

.cat-card{position:relative;aspect-ratio:16/9;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border-glass);background:linear-gradient(135deg,var(--navy),var(--bg))}
.cat-card .cap{position:absolute;inset:auto 0 0 0;padding:var(--space-3) var(--space-4);background:linear-gradient(transparent,var(--scrim))}

.stat{display:grid;grid-template-columns:96px 1fr auto;gap:var(--space-3);align-items:center;font-size:var(--text-sm)}
.stat .track{height:10px;border-radius:var(--radius-pill);background:var(--muted);overflow:hidden}
.stat .fill{height:100%;width:var(--v,50%);background:var(--fg);border-radius:inherit;transition:width 300ms var(--ease)}
.stat .delta{font-weight:700;min-width:44px;text-align:right}
.stat .delta.up{color:var(--accent)} .stat .delta.down{color:var(--destructive)}

.progress{height:14px;border-radius:var(--radius-pill);background:var(--muted);border:1px solid var(--border-glass);overflow:hidden}
.progress>i{display:block;height:100%;width:var(--v,0%);background:linear-gradient(90deg,var(--accent),#7be08a);transition:width 400ms var(--ease)}

.topbar{position:sticky;top:0;z-index:var(--z-sticky);display:flex;align-items:center;gap:var(--space-4);padding:var(--space-2) var(--space-4);flex-wrap:wrap;
  background:var(--scrim);border-bottom:1px solid var(--border-glass);-webkit-backdrop-filter:blur(var(--glass-blur));backdrop-filter:blur(var(--glass-blur))}
.topbar .speed{display:flex;gap:4px;margin-left:auto}
.topbar .speed button{min-width:44px;min-height:44px;border-radius:var(--radius-sm);border:1px solid var(--border-glass);background:var(--surface);color:var(--fg);font:600 var(--text-sm) var(--font-body);cursor:pointer}
.topbar .speed button[aria-pressed=true]{background:var(--fg);color:var(--navy)}

.tabs{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--border-glass);border-radius:var(--radius-pill);width:fit-content;max-width:100%;overflow-x:auto}
.tabs button{min-height:40px;padding:0 var(--space-4);border:0;border-radius:var(--radius-pill);background:transparent;color:var(--fg);font:600 var(--text-sm) var(--font-body);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--fg);color:var(--navy)}
.tabs button:disabled{opacity:.45;cursor:not-allowed}
.toast{display:flex;gap:var(--space-3);align-items:center;padding:var(--space-3) var(--space-4);background:var(--navy);border:1px solid var(--border-glass);border-radius:var(--radius-md);box-shadow:var(--shadow-2);z-index:var(--z-toast)}
.toast.live{animation:toast var(--toast-ms) var(--ease) both}
@keyframes toast{0%{opacity:0;transform:translateY(12px)}10%,85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-8px)}}
.modal-scrim{position:fixed;inset:0;display:grid;place-items:center;padding:var(--space-4);background:var(--scrim);z-index:var(--z-modal)}
.modal{width:min(480px,100%);padding:var(--space-6);display:grid;gap:var(--space-4)}
.modal .choices{display:grid;gap:var(--space-3)}
.modal .choice{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);min-height:56px;padding:var(--space-3) var(--space-4);text-align:left;border-radius:var(--radius-md)}
.sheet{position:fixed;inset:auto 0 0 0;z-index:var(--z-sheet);max-height:70vh;overflow:auto;padding:var(--space-4);background:var(--navy);border:1px solid var(--border-glass);border-radius:var(--radius-xl) var(--radius-xl) 0 0}
.sheet::before{content:"";display:block;width:40px;height:4px;margin:0 auto var(--space-3);border-radius:4px;background:var(--steel)}
.stars{display:inline-flex;gap:2px;color:var(--gold)} .stars svg{width:18px;height:18px;fill:currentColor;stroke:none}
.stars .off{color:var(--steel)}
@media (prefers-reduced-motion:reduce){.tile-grid .tile,.toast.live{animation:none}.btn,.tile{transition:none}}

/* Vermelho em texto pequeno só sobre navy (4.15:1 sobre royal reprova AA; sobre navy passa). */
.neg{display:inline-block;padding:1px 8px;border-radius:var(--radius-pill);background:var(--navy);color:var(--destructive);font-weight:700}
.pos{color:var(--accent);font-weight:700}
.stat .delta.down{background:var(--navy);padding:1px 8px;border-radius:var(--radius-pill)}
.chip.down::before{color:var(--destructive)}

.app{display:grid;gap:var(--space-4);padding:var(--space-4);max-width:1200px;margin:0 auto;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr)}
@media (max-width:860px){.app{grid-template-columns:1fr}}
.stage{padding:var(--space-4);position:sticky;top:var(--space-2);align-self:start;z-index:var(--z-sticky)}
@media (max-width:860px){.stage{top:0;padding:var(--space-2)}}
.stage svg{width:100%;height:auto;display:block}
.panel{padding:var(--space-4);display:grid;gap:var(--space-4)}
.field{display:grid;gap:4px;font-size:var(--text-xs)} .field>span{font-weight:700}
select{min-height:44px;border-radius:var(--radius-sm);border:1px solid var(--border-glass);background:var(--navy);color:var(--fg);font:inherit;font-size:var(--text-sm);padding:0 10px;width:100%}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:var(--space-3)}
.sw{display:flex;flex-wrap:wrap;gap:6px} .sw button{width:36px;height:36px;border-radius:50%;border:2px solid var(--border-glass);cursor:pointer;padding:0}
.sw button[aria-pressed=true]{border-color:#fff;box-shadow:0 0 0 2px var(--bg),0 0 0 4px #fff}
.chips{display:flex;flex-wrap:wrap;gap:6px} .chips label{display:inline-flex;gap:6px;align-items:center;min-height:36px;padding:0 10px;border-radius:var(--radius-pill);background:var(--muted);border:1px solid var(--border-glass);font-size:var(--text-xs)}
.stages{display:flex;gap:4px;margin-top:var(--space-3)} .stages i{flex:1;height:6px;border-radius:6px;background:var(--steel)}
.warn{font-size:var(--text-xs);color:var(--text-soft);min-height:1.5em}
pre{margin:0;max-height:220px;overflow:auto;font:12px/1.4 var(--font-mono);color:var(--text-soft);white-space:pre-wrap}
h1{margin:0;font-size:var(--text-xl)} h2{margin:0;font-size:var(--text-md);font-family:var(--font-body);font-weight:700}
</style></head><body>
<main class="app">
 <section class="glass stage blueprint" aria-label="Palco do designer">
  <div id="bike"></div><div class="stages" aria-hidden="true" id="stages"></div>
  <div class="row" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
   <button class="btn btn-primary" id="replay">Reproduzir montagem</button>
   <button class="btn btn-secondary" id="random">Combinação aleatória</button>
  </div>
 </section>
 <section class="glass panel">
  <h1 class="display">Bike2D · Fase 2</h1>
  <label class="field"><span>Exemplo pronto</span><select id="example"></select></label>
  <div class="fields" id="fields"></div>
  <div class="field"><span>Cor da pintura</span><div class="sw" id="paint"></div></div>
  <div class="field"><span>Cor de acento (aros, listra, molas)</span><div class="sw" id="accent"></div></div>
  <label class="field"><span>Acabamento</span><select id="finish"></select></label>
  <div class="field"><span>Eletrônicos</span><div class="chips" id="elec"></div></div>
  <label class="chips" style="gap:8px"><label><input type="checkbox" id="rearDisc"> Disco traseiro</label></label>
  <p class="warn" id="warn" role="status"></p>
  <details><summary>BikeSpec (JSON)</summary><pre id="json"></pre></details>
 </section>
</main>
<script>
// Geometria base das categorias. viewBox 0 0 1000 600, chão em y = rear.y + R. Moto olha para a DIREITA.
const rad = d => d * Math.PI / 180;
const VIEWBOX = '0 0 1000 600';
const GEO = {
  'scooter':    { R:100, rear:[225,400], front:[800,400], rake:20, forkLen:205, engine:[305,410], pivot:[330,404], seat:[400,262], bar:'flat',   stripe:[[300,352],[492,340]], frame:'backbone',  fork:'telescopic', shock:'dual', wheels:'steel',  tyres:'commuter', exhaust:'stock' },
  'cafe-racer': { R:135, rear:[205,365], front:[815,365], rake:27, forkLen:255, engine:[470,368], pivot:[335,388], seat:[330,185], bar:'clipon', stripe:[[215,214],[668,170]], frame:'cradle',    fork:'telescopic', shock:'dual', wheels:'spoke',  tyres:'touring',  exhaust:'twin' },
  'sportbike':  { R:130, rear:[215,370], front:[795,370], rake:24, forkLen:250, engine:[460,372], pivot:[345,392], seat:[320,205], bar:'clipon', stripe:[[240,226],[640,186]], frame:'twinspar',  fork:'usd',        shock:'mono', wheels:'alloy',  tyres:'sport',    exhaust:'full' }
};
const CATEGORIES = Object.keys(GEO);
function anchors(cat) {
  const g = GEO[cat]; if (!g) throw new Error('categoria sem silhueta na Fase 2: ' + cat);
  const t = rad(g.rake), d = [Math.sin(t), Math.cos(t)];            // d = direção do garfo (para baixo e para frente)
  const head = [g.front[0] - g.forkLen * d[0], g.front[1] - g.forkLen * d[1]];   // cabeça de direção
  const forkTop = [head[0] - 18 * d[0], head[1] - 18 * d[1]];                    // pivô do garfo (topo)
  return { ...g, cat, forkDir: d, head, forkTop, groundY: g.rear[1] + g.R, tyreW: g.R * .27, rimR: g.R * .73,
    exhaustOut: [g.rear[0] - 22, g.rear[1] + 20] };                               // saída do escape
}

// Peças da moto 2D. Cada função recebe os anchors (geometry.js) e o BikeSpec e devolve markup SVG.
// Cores só por variáveis CSS (com fallback). Nada de fontes, scripts ou imagens externas.
const f = n => Math.round(n * 10) / 10;
const pt = p => `${f(p[0])},${f(p[1])}`;
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
const rot = (p, deg) => { const t = deg * Math.PI / 180; return [p[0] * Math.cos(t) - p[1] * Math.sin(t), p[0] * Math.sin(t) + p[1] * Math.cos(t)]; };
const METAL = 'var(--metal,#c5cedb)', METAL_D = 'var(--metal-dark,#66748a)', RUBBER = 'var(--rubber,#14171c)', ACC = 'var(--accent-paint,#f2c230)', OUT = 'var(--outline,rgba(7,26,74,.55))';
const line = (a, b, w, s, o = '') => `<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="${s}" stroke-width="${w}" stroke-linecap="round" ${o}/>`;
const poly = (pts, w, s, o = '') => `<polyline points="${pts.map(pt).join(' ')}" fill="none" stroke="${s}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${o}/>`;
const circ = (c, r, fill, stroke = 'none', sw = 0, o = '') => `<circle cx="${f(c[0])}" cy="${f(c[1])}" r="${f(r)}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" ${o}/>`;
const coil = (a, b, n, amp, w, s) => {
  const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy), nx = -dy / len, ny = dx / len, pts = [a];
  for (let i = 0; i < n; i++) { const t = (i + .5) / n, k = i % 2 ? -amp : amp; pts.push([a[0] + dx * t + nx * k, a[1] + dy * t + ny * k]); }
  pts.push(b); return poly(pts, w, s);
};
const FRAME_COL = { steel: '#27313f', aluminum: '#b4bfcd', carbon: '#10141a' };

// ---------- mapa de equivalências: o que ainda é aproximado nesta fase ----------
const FALLBACK = {
  engine: { v: 'parallel', boxer: 'parallel', inline3: 'inline', v4: 'inline', inline6: 'inline', electric: 'parallel' },
  frame: { monocoque: 'perimeter' }, fork: { semiactive: 'usd' }, shock: { linkage: 'mono', semiactive: 'mono' },
  brake: { monoblock: 'radial' }, exhaust: { underseat: 'full' }
};
const OPTIONS = {
  engine: ['single', 'parallel', 'inline'], cooling: ['air', 'oil', 'liquid'],
  frame: ['backbone', 'cradle', 'doublecradle', 'trellis', 'perimeter', 'twinspar'], material: ['steel', 'aluminum', 'carbon'],
  fork: ['telescopic', 'cartridge', 'usd'], shock: ['dual', 'mono'], brake: ['drum', 'single', 'twin', 'radial'],
  wheels: ['spoke', 'steel', 'alloy', 'forged', 'carbon'], tyres: ['commuter', 'touring', 'sport', 'track', 'offroad'],
  fairing: ['none', 'half', 'full', 'touring', 'winglets'], exhaust: ['stock', 'twin', 'megaphone', 'slipon', 'full', 'titanium'],
  electronics: ['tft', 'led', 'radar', 'cruise', 'riding_modes', 'traction_control', 'quickshifter', 'imu']
};

// ---------- 6 · rodas e pneus (independentes, para o aro receber o acento) ----------
function wheelsParts(A, s) {
  const tyre = [], rim = [], R = A.R, tw = A.tyreW, ri = R - tw, t = s.tyres || 'sport', type = s.wheels || 'spoke';
  for (const c of [A.rear, A.front]) {
    let g = `<g transform="translate(${f(c[0])} ${f(c[1])})">`;
    g += `<circle r="${f(R - tw / 2)}" fill="none" stroke="${RUBBER}" stroke-width="${f(tw)}"/>`;
    if (t === 'commuter') g += `<circle r="${f(R - tw * .5)}" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="${f(tw * .55)}" stroke-dasharray="3 7"/>`;
    if (t === 'touring') g += `<circle r="${f(R - tw * .5)}" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="${f(tw * .3)}" stroke-dasharray="16 6"/>`;
    if (t === 'sport' || t === 'track') g += `<circle r="${f(R - 4)}" fill="none" stroke="#fff" stroke-opacity="${t === 'track' ? .05 : .1}" stroke-width="2"/>`;
    if (t === 'offroad') g += `<circle r="${f(R - 3)}" fill="none" stroke="${RUBBER}" stroke-width="8" stroke-dasharray="10 8"/><circle r="${f(R - 3)}" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="2" stroke-dasharray="10 8"/>`;
    tyre.push(g + '</g>');
    let r = `<g transform="translate(${f(c[0])} ${f(c[1])})">`;

// ---------- 1 · motor (3 layouts na Fase 2) ----------
function engineLayer(A, s) {
  const e = s._engine, [cx, cy] = A.engine, sc = A.cat === 'scooter';

  const bw = sc ? 52 : e.layout === 'single' ? 62 : e.layout === 'parallel' ? 72 : 98, bh = sc ? 70 : e.layout === 'single' ? 96 : 104;

    b += `<rect x="${-bw / 2}" y="${-bh - 6}" width="${bw}" height="${bh}" rx="6" fill="${dim ? METAL_D : METAL_D}" stroke="${OUT}" stroke-width="2"/>`;

    else b += `<rect x="${-bw / 2 + 6}" y="${-bh}" width="${bw - 12}" height="${bh - 14}" rx="5" fill="${METAL}" opacity=".35"/>`;
    b += `<rect x="${-bw / 2 - 3}" y="${-bh - 42}" width="${bw + 6}" height="40" rx="8" fill="${METAL}" stroke="${OUT}" stroke-width="2"/>`;
    b += `<rect x="${-bw / 2 + 6}" y="${-bh - 58}" width="${bw - 12}" height="18" rx="6" fill="${METAL_D}" stroke="${OUT}" stroke-width="2"/>`;

    return b + '</g>';

}

// ---------- 2 · escapamento ----------
function exhaustLayer(A, s) {
  const e = s._engine, [cx, cy] = A.engine, sc = A.cat === 'scooter', type = s._exhaust;
  const tilt = sc ? 82 : e.layout === 'single' ? 6 : e.layout === 'parallel' ? 12 : (A.cat === 'sportbike' ? 26 : 16);
  const bw = e.layout === 'single' ? 62 : e.layout === 'parallel' ? 72 : 98, bh = 100;
  const H0 = add(A.engine, rot([sc ? 40 : bw / 2 - 4, sc ? -30 : -bh - 14], tilt));

  const u = [Mr[0] - Mf[0], Mr[1] - Mf[1]], len = Math.hypot(...u), un = [u[0] / len, u[1] / len], nn = [-un[1], un[0]];

    g += `<path d="M${pt(add(H0, [0, o]))} C${pt(add(H0, [26, 36 + o]))} ${pt([cx + 92, cy + 4 + o])} ${pt([cx + 62, cy + 62 + o])} S${pt([cx + 20, cy + 82 + o])} ${pt(add(Mf, [0, o * .5]))}" fill="none" stroke="${METAL}" stroke-width="9" stroke-linecap="round"/><path d="M${pt(add(H0, [0, o]))} C${pt(add(H0, [26, 36 + o]))} ${pt([cx + 92, cy + 4 + o])} ${pt([cx + 62, cy + 62 + o])} S${pt([cx + 20, cy + 82 + o])} ${pt(add(Mf, [0, o * .5]))}" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="2.5" stroke-linecap="round"/>`; }

  else { const full = type === 'full' || type === 'titanium', cb = [Mr[0] - un[0] * (full ? 130 : 105), Mr[1] - un[1] * (full ? 130 : 105)], tip = add(Mr, [0, full ? -16 : 0]);

// ---------- 3 · chassi (quadro + balança) ----------

  let g = tube([P, A.rear], 17);

  const t = s._frame;
  if (t === 'backbone') g += tube([H, [P[0] + 20, P[1] - 80]], 18) + tube([[P[0] + 20, P[1] - 80], P], 12) + tube([[P[0] + 20, P[1] - 80], RS], 9) + tube([H, F, E, P], 8);
  else if (t === 'cradle') g += tube([H, T], 14) + tube([T, P], 12) + tube([H, F, E, P], 12) + tube([T, RS], 9);

// ---------- 4 · suspensão (garfo, guidão, amortecedor) ----------

// ---------- 5 · freios ----------
